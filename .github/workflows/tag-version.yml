name: Tag version

on:
  push:
    branches: [main]
    paths: [template/references/workspace.md]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the reference title
        id: version
        run: |
          title=$(head -n 1 template/references/workspace.md)
          version=$(printf '%s\n' "$title" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -z "$version" ]; then
            echo "::error file=template/references/workspace.md,line=1::title has no vX.Y.Z version: $title"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag the commit if the version is new
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
            echo "$VERSION is already tagged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
